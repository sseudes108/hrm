[project]
name = "bankai-platform"
version = "0.1.0"
description = "Plataforma Streamlit para aplicações Bankai isoladas."
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.2.6",
    "ortools>=9.15.6755",
    "pandas>=2.3.3",
    "pandas-ta>=0.4.71b0",
    "psycopg2-binary>=2.9.12",
    "python-dotenv>=1.2.2",
    "streamlit>=1.55.0",
    "streamlit-echarts>=0.6,<0.7",
    "streamlit-js-eval>=1.0.0",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"